# PanganTrace AI — Docker Compose (Development)
# Full stack: Backend + Frontend + Gateway

services:
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - APP_ENV=development
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    env_file:
      - ../frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend

  gateway:
    image: php:8.3-cli
    ports:
      - "8080:8080"
    volumes:
      - ../gateway:/app
    working_dir: /app
    command: php artisan serve --host=0.0.0.0 --port=8080
    env_file:
      - ../gateway/.env
    environment:
      - FASTAPI_URL=http://backend:8000
    depends_on:
      - backend
